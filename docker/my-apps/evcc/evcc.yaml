# evcc config, mounted read-only at /etc/evcc.yaml. Devices defined here show as
# read-only in the UI; anything added in the UI lands in evcc.db instead.
#
# Real:      HomeWizard P1 (grid), Zonneplan dynamic tariff.
# Simulated: charger + car, until a real charger is bought. Replace the `sim_*`
#            blocks with the charger's template (docs.evcc.io/en/chargers) then.

interval: 30s

site:
  title: Home
  meters:
    grid: p1

meters:
  # HomeWizard P1, same IP as HA's HomeWizard entry; give it a DHCP reservation.
  # Grid power = real P1 + the simulated charger, else evcc reads sim charging as
  # solar surplus and never stops. With a real charger, swap back to:
  #   type: template / template: homewizard / usage: grid / host: 192.168.1.185
  - name: p1
    type: custom
    power:
      source: js
      vm: sim
      script: tick(); p1 + state.power
      in:
        - name: p1
          type: float
          config:
            source: http
            uri: http://192.168.1.185/api/v1/data
            jq: .active_power_w
    energy:
      source: http
      uri: http://192.168.1.185/api/v1/data
      jq: .total_power_import_kwh

  - name: sim_charge_meter
    type: custom
    power:
      source: js
      vm: sim
      script: tick(); state.power
    energy:
      source: js
      vm: sim
      script: tick(); state.kwh

tariffs:
  currency: EUR
  # Zonneplan all-in (EPEX + markup + energy tax + VAT) from epexprijzen.nl. Same fetch
  # as evcc's epexprijzen-nl template, which hard-codes a 1 h cache; written out so
  # tomorrow's prices (published ~13:00) show up within 15 min instead of up to an hour.
  grid:
    type: custom
    forecast:
      source: http
      uri: https://epexprijzen.nl/api/v1/prices/zonneplan/quarterly
      jq: |
        (.today // []) + (.tomorrow // []) | map({
          "start": (.t | strptime("%Y-%m-%dT%H:%M:%S%z") | strftime("%Y-%m-%dT%H:%M:%SZ")),
          "end": (.t | strptime("%Y-%m-%dT%H:%M:%S%z") | mktime + 900 | strftime("%Y-%m-%dT%H:%M:%SZ")),
          "value": .price
        }) | tostring
      cache: 10m
    interval: 15m

# Simulated 11 kW charger (3x16 A, switchable to 1 phase) with a 65 kWh car.
# Charging stops by itself at 100%. Start/stop: evcc mode Fast/Off (or HA's
# select.evcc_charge_mode). "Empty the car": HA's button.evcc_empty_simulated_car
# writes a new token to /sim/drain; a changed token resets SoC to 10%.
# Plug in/out: HA's switch.evcc_simulated_car_plugged writes /sim/plug.
# State is in-memory: an evcc restart starts the car at 10% again.
javascript:
  - vm: sim
    script: |
      state = { enabled: false, current: 6, phases: 3, power: 0, kwh: 0, soc: 10, last: Date.now(), drain: null };
      function tick(drain) {
        var now = Date.now();
        if (drain !== undefined && state.drain !== null && drain !== state.drain) state.soc = 10;
        if (drain !== undefined) state.drain = drain;
        state.power = state.enabled && state.soc < 100 ? state.current * 230 * state.phases : 0;
        var kwh = state.power * (now - state.last) / 3.6e9;
        state.kwh += kwh;
        state.soc = Math.min(state.soc + kwh / 65 * 100, 100);
        state.last = now;
      }

chargers:
  - name: sim_charger
    type: custom
    # plug = /sim/plug, written by HA's switch.evcc_simulated_car_plugged ("0" = unplugged)
    status:
      source: js
      vm: sim
      script: 'tick(); plug.trim() === "0" ? "A" : state.power > 0 ? "C" : "B"'
      in:
        - name: plug
          type: string
          config:
            source: script
            cmd: cat /sim/plug
    enabled:
      source: js
      vm: sim
      script: state.enabled
    enable:
      source: js
      vm: sim
      script: tick(); state.enabled = enable
    maxcurrent:
      source: js
      vm: sim
      script: tick(); state.current = maxcurrent
    # 1p/3p switching like a phase-switching wallbox; evcc only sends it while a car is connected
    phases1p3p:
      source: js
      vm: sim
      script: tick(); state.phases = phases

vehicles:
  - name: sim_car
    type: custom
    title: Simulated EV
    capacity: 65
    soc:
      source: js
      vm: sim
      script: tick(drain); state.soc
      in:
        - name: drain
          type: string
          config:
            source: script
            cmd: cat /sim/drain

loadpoints:
  - title: Driveway (simulated)
    charger: sim_charger
    meter: sim_charge_meter
    vehicle: sim_car
    # no default mode on purpose: evcc would reapply it on every restart and
    # overrule the mode HA's Manual/Solar logic set; evcc keeps the last mode instead
