services:
  rfid-analyzer:
    image: ghcr.io/martbent/rtl-sdr-uhf-rfid-analyzer:latest
    container_name: rfid-analyzer
    restart: unless-stopped
    ports:
      - "8080:80"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../../ha:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    network_mode: host
    environment:
      - DOMAIN_NAME=${N8N_DOMAIN}
      - SUBDOMAIN=${N8N_SUBDOMAIN}
      - TZ=Europe/Amsterdam
      - GENERIC_TIMEZONE=Europe/Amsterdam
      - WEBHOOK_URL=https://${N8N_SUBDOMAIN}.${N8N_DOMAIN}
      - N8N_HOST=${N8N_SUBDOMAIN}.${N8N_DOMAIN}
    volumes:
      - n8n_data:/home/node/.n8n

  echo-server:
    build: ./echo-server
    container_name: echo-server
    restart: unless-stopped
    ports:
      - "8082:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/services/homes/MartBent/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  n8n_data:
