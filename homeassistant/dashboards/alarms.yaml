# Smart Alarm Clock standalone YAML dashboard.
#
# A dedicated dashboard (its own sidebar entry) for configuring the alarms, using
# the modern "sections" view layout + the household "Mart's Theme"
# (themes/mart.yaml). Built-in cards only, no HACS.
#
# Install as a YAML-mode dashboard: copy this file to <config>/dashboards/alarms.yaml,
# copy themes/mart.yaml to <config>/themes/, and register in
# configuration.yaml:
#
#   lovelace:
#     dashboards:
#       alarm-clock:
#         mode: yaml
#         title: Alarms
#         icon: mdi:alarm
#         show_in_sidebar: true
#         filename: dashboards/alarms.yaml
#
# Assumes canonical entity_ids from a clean integration add
# (switch.smart_alarm_clock_alarm_1..8 / time.smart_alarm_clock_alarm_1_time..8).
title: Alarms
views:
  - title: Alarms
    path: alarms
    icon: mdi:alarm
    theme: "Mart's Theme"
    type: sections
    max_columns: 3
    sections:
      # ---- Status + controls -------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Smart Alarm Clock
            heading_style: title
            icon: mdi:alarm
          - type: glance
            show_name: true
            show_state: true
            state_color: true
            columns: 2
            entities:
              - entity: sensor.smart_alarm_clock_time
                name: Clock
                icon: mdi:clock-outline
              - entity: sensor.smart_alarm_clock_phase
                name: Status
                icon: mdi:alarm
          - type: entities
            show_header_toggle: false
            state_color: true
            entities:
              - type: buttons
                entities:
                  - entity: button.smart_alarm_clock_snooze
                    name: Snooze
                    icon: mdi:alarm-snooze
                  - entity: button.smart_alarm_clock_dismiss
                    name: Dismiss
                    icon: mdi:alarm-off

      # ---- The 8 alarm slots (tile into the section grid) --------------------
      - type: grid
        cards:
          - type: heading
            heading: Alarms
            heading_style: subtitle
            icon: mdi:alarm-multiple
          - type: entities
            title: Alarm 1
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.smart_alarm_clock_alarm_1
                name: Enabled
              - entity: time.smart_alarm_clock_alarm_1_time
                name: Time
          - type: entities
            title: Alarm 2
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.smart_alarm_clock_alarm_2
                name: Enabled
              - entity: time.smart_alarm_clock_alarm_2_time
                name: Time
          - type: entities
            title: Alarm 3
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.smart_alarm_clock_alarm_3
                name: Enabled
              - entity: time.smart_alarm_clock_alarm_3_time
                name: Time
          - type: entities
            title: Alarm 4
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.smart_alarm_clock_alarm_4
                name: Enabled
              - entity: time.smart_alarm_clock_alarm_4_time
                name: Time
          - type: entities
            title: Alarm 5
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.smart_alarm_clock_alarm_5
                name: Enabled
              - entity: time.smart_alarm_clock_alarm_5_time
                name: Time
          - type: entities
            title: Alarm 6
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.smart_alarm_clock_alarm_6
                name: Enabled
              - entity: time.smart_alarm_clock_alarm_6_time
                name: Time
          - type: entities
            title: Alarm 7
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.smart_alarm_clock_alarm_7
                name: Enabled
              - entity: time.smart_alarm_clock_alarm_7_time
                name: Time
          - type: entities
            title: Alarm 8
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.smart_alarm_clock_alarm_8
                name: Enabled
              - entity: time.smart_alarm_clock_alarm_8_time
                name: Time
