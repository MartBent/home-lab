# Smart Alarm Clock configure card (built-in cards only, no HACS needed).
#
# Restyled for "Mart's Theme" (themes/mart.yaml): heading cards structure the
# view, a glance card gives the clock prominence, and the flat hairline card
# look comes entirely from the theme. It's the household default, so no per-card
# theme override is needed, though you can pin it with:  theme: Mart's Theme
#
# Paste into a dashboard: Edit dashboard → ⋮ → "Edit in YAML" and add this under
# `cards:`, or "Add card → Manual" and paste one card at a time.
#
# Assumes a clean re-add of the integration so entity_ids are canonical
# (switch.smart_alarm_clock_alarm_1..8 / time.smart_alarm_clock_alarm_1_time..8).
type: vertical-stack
cards:
  - type: heading
    heading: Smart Alarm Clock
    heading_style: title
    icon: mdi:alarm

  # Clock + phase, given room to read as the focal point.
  - type: glance
    show_name: true
    show_state: true
    state_color: true
    columns: 2
    entities:
      - entity: sensor.smart_alarm_clock_time
        name: Clock
        icon: mdi:clock-outline
      - entity: sensor.smart_alarm_clock_phase
        name: Status
        icon: mdi:alarm

  - type: entities
    show_header_toggle: false
    state_color: true
    entities:
      - type: buttons
        entities:
          - entity: button.smart_alarm_clock_snooze
            name: Snooze
            icon: mdi:alarm-snooze
          - entity: button.smart_alarm_clock_dismiss
            name: Dismiss
            icon: mdi:alarm-off

  - type: heading
    heading: Alarms
    heading_style: subtitle
    icon: mdi:alarm-multiple

  - type: grid
    columns: 2
    square: false
    cards:
      - type: entities
        title: Alarm 1
        show_header_toggle: false
        state_color: true
        entities:
          - entity: switch.smart_alarm_clock_alarm_1
            name: Enabled
          - entity: time.smart_alarm_clock_alarm_1_time
            name: Time
      - type: entities
        title: Alarm 2
        show_header_toggle: false
        state_color: true
        entities:
          - entity: switch.smart_alarm_clock_alarm_2
            name: Enabled
          - entity: time.smart_alarm_clock_alarm_2_time
            name: Time
      - type: entities
        title: Alarm 3
        show_header_toggle: false
        state_color: true
        entities:
          - entity: switch.smart_alarm_clock_alarm_3
            name: Enabled
          - entity: time.smart_alarm_clock_alarm_3_time
            name: Time
      - type: entities
        title: Alarm 4
        show_header_toggle: false
        state_color: true
        entities:
          - entity: switch.smart_alarm_clock_alarm_4
            name: Enabled
          - entity: time.smart_alarm_clock_alarm_4_time
            name: Time
      - type: entities
        title: Alarm 5
        show_header_toggle: false
        state_color: true
        entities:
          - entity: switch.smart_alarm_clock_alarm_5
            name: Enabled
          - entity: time.smart_alarm_clock_alarm_5_time
            name: Time
      - type: entities
        title: Alarm 6
        show_header_toggle: false
        state_color: true
        entities:
          - entity: switch.smart_alarm_clock_alarm_6
            name: Enabled
          - entity: time.smart_alarm_clock_alarm_6_time
            name: Time
      - type: entities
        title: Alarm 7
        show_header_toggle: false
        state_color: true
        entities:
          - entity: switch.smart_alarm_clock_alarm_7
            name: Enabled
          - entity: time.smart_alarm_clock_alarm_7_time
            name: Time
      - type: entities
        title: Alarm 8
        show_header_toggle: false
        state_color: true
        entities:
          - entity: switch.smart_alarm_clock_alarm_8
            name: Enabled
          - entity: time.smart_alarm_clock_alarm_8_time
            name: Time
