# evcc -> Home Assistant, straight off evcc's REST API (no HACS integration).
# Feeds the Energy dashboard: Zonneplan all-in price for grid cost, EV charge total
# as an individual device. Loadpoint index 0 = the first (currently simulated) charger.
rest:
  - resource: http://server.home:7070/api/state
    scan_interval: 30
    sensor:
      - name: evcc Grid price
        unique_id: evcc_grid_price
        value_template: "{{ value_json.tariffGrid }}"
        unit_of_measurement: EUR/kWh
        state_class: measurement
        icon: mdi:currency-eur

      - name: evcc Charge total
        unique_id: evcc_charge_total
        # null until the first kWh is charged; unavailable beats a fake 0 in long-term stats
        value_template: "{{ value_json.loadpoints[0].chargeTotalImport }}"
        availability: "{{ value_json is defined and value_json.loadpoints[0].chargeTotalImport is number }}"
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing

      - name: evcc Charge power
        unique_id: evcc_charge_power
        value_template: "{{ value_json.loadpoints[0].chargePower }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement

      - name: evcc Vehicle SoC
        unique_id: evcc_vehicle_soc
        value_template: "{{ value_json.loadpoints[0].vehicleSoc | round(1) }}"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        json_attributes_path: "$.loadpoints[0]"
        json_attributes: [effectivePlanSoc, effectivePlanTime, planProjectedStart, planProjectedEnd, charging, chargeRemainingEnergy, effectiveLimitSoc,
                          connected, phasesConfigured, phasesActive, minCurrent, maxCurrent, pvAction, pvRemaining]

      - name: evcc Mode
        unique_id: evcc_mode
        value_template: "{{ value_json.loadpoints[0].mode }}"
        icon: mdi:ev-station
        # the car's repeating charge plans, which Solar switches off (rest_command.evcc_set_plans_active)
        json_attributes_path: "$.vehicles.sim_car"
        json_attributes: [repeatingPlans]

  # Price forecast (15-min slots, today + tomorrow after ~13:00) and evcc's chosen
  # charging slots for the active plan. Both feed www/evcc-price-card.js.
  - resource: http://server.home:7070/api/tariff/grid
    # 5 min: after an evcc restart the first fetch can come back empty; local and cheap
    scan_interval: 300
    sensor:
      - name: evcc Price forecast
        unique_id: evcc_price_forecast
        # state = when the known prices run out
        value_template: "{{ (value_json.rates | last).end if value_json.rates else none }}"
        device_class: timestamp
        json_attributes: [rates]

  # Expected sunlight on the panels per 15 min (W/m², UTC), from Open-Meteo. The URL is in
  # the untracked secrets.yaml because it holds the home coordinates (this repo is public):
  #   https://api.open-meteo.com/v1/forecast?latitude=..&longitude=..&minutely_15=global_tilted_irradiance
  #     &tilt=35&azimuth=0&forecast_days=2&timezone=GMT     (azimuth 0 = south, -90 east, 90 west)
  # The card turns it into watts with its solar_kwp option.
  - resource: !secret open_meteo_solar_url
    scan_interval: 1800
    sensor:
      - name: Solar forecast
        unique_id: solar_forecast
        value_template: "{{ value_json.minutely_15.global_tilted_irradiance | max }}"
        unit_of_measurement: W/m²
        json_attributes_path: "$.minutely_15"
        json_attributes: [time, global_tilted_irradiance]

  - resource: http://server.home:7070/api/loadpoints/1/plan
    scan_interval: 60
    sensor:
      - name: evcc Charge plan
        unique_id: evcc_charge_plan
        value_template: "{{ value_json.planTime if value_json.planId else none }}"
        device_class: timestamp
        json_attributes: [plan, duration, power]

# The rate list is too big for the recorder's attribute limit and its history has no value.
recorder:
  exclude:
    entities:
      - sensor.evcc_price_forecast
      - sensor.evcc_charge_plan
      - sensor.solar_forecast

# evcc's API is unauthenticated on the LAN for mode changes.
rest_command:
  # read straight from evcc (response_variable): the REST sensors refresh at most every 10 s
  evcc_get:
    url: "http://server.home:7070/api/{{ path }}"
    method: get
  evcc_set_mode:
    url: "http://server.home:7070/api/loadpoints/1/mode/{{ mode }}"
    method: post
  # only ever called while the car is unplugged, see automation evcc_mode
  evcc_set_phases:
    url: "http://server.home:7070/api/loadpoints/1/phases/{{ phases }}"
    method: post
  # shortcut: switches every repeating plan on or off together; fine while there is one
  evcc_set_plans_active:
    url: "http://server.home:7070/api/vehicles/sim_car/plan/repeating"
    method: post
    content_type: application/json
    payload: >-
      [{% for p in state_attr('sensor.evcc_mode', 'repeatingPlans') or [] %}{{ dict(p, active=active) | tojson }}{{ ',' if not loop.last }}{% endfor %}]
  # Smart's target (soc %, time "HH:MM" every day) into evcc's repeating plans; creates one if there is none
  evcc_set_plan_target:
    url: "http://server.home:7070/api/vehicles/sim_car/plan/repeating"
    method: post
    content_type: application/json
    payload: >-
      {%- set plans = state_attr('sensor.evcc_mode', 'repeatingPlans') or [{'weekdays': [0, 1, 2, 3, 4, 5, 6], 'tz': now().tzinfo | string, 'active': true}] -%}
      [{% for p in plans %}{{ dict(p, soc=soc | int, time=time) | tojson }}{{ ',' if not loop.last }}{% endfor %}]

# Read by evcc's simulated car (mounted at /sim); a new token resets its SoC to 10%.
# Remove together with the sim_* blocks in evcc.yaml once a real charger is in.
shell_command:
  evcc_empty_simulated_car: "mkdir -p /config/evcc-sim && date +%s > /config/evcc-sim/drain"
  # /sim/plug: "0" = unplugged (charger status A). No templates: they'd disable the shell redirect.
  evcc_plug_in_simulated_car: "mkdir -p /config/evcc-sim && echo 1 > /config/evcc-sim/plug"
  evcc_unplug_simulated_car: "mkdir -p /config/evcc-sim && echo 0 > /config/evcc-sim/plug"

template:
  - button:
      - name: evcc Empty simulated car
        unique_id: evcc_empty_simulated_car
        icon: mdi:car-arrow-left
        press:
          - action: shell_command.evcc_empty_simulated_car

# The charge mode lives in HA; automation evcc_mode turns it into evcc settings.
# Fast, Smart and Manual charge on 3 phases, Solar on 1. smart comes first so a fresh
# install starts there, not in fast.
input_select:
  evcc_charge_mode:
    name: evcc Charge mode
    icon: mdi:ev-station
    options: [smart, fast, manual, solar]

input_boolean:
  # Simulated car's plug, written to /sim/plug by automation evcc_simulated_car_plug.
  # A plain toggle on purpose: an optimistic template switch went stale. evcc sees a change
  # within its 30 s cycle; the card shows evcc's own "connected".
  evcc_simulated_car_plugged:
    name: evcc Simulated car plugged in
    icon: mdi:ev-plug-type2
    initial: true # matches /sim/plug's default; an HA restart plugs the simulated car back in

# Manual: quarter-hours painted on the dashboard graph (www/evcc-price-card.js).
# Stored as "<base>:<hex>": base = epoch quarter (unix time // 900) of the first bit,
# then one bit per quarter, most significant bit first per hex digit (max 32 chars).
input_text:
  evcc_manual_hours:
    name: evcc Manual hours
    max: 255
  # Smart: the quarters script.evcc_smart_plan picked, same format plus ":<quarter>" =
  # where the known prices ended when it planned (the card offers a replan once they reach further).
  evcc_smart_hours:
    name: evcc Smart hours
    max: 255

script:
  # Smart's plan: the cheapest quarters with a known price before the car's target, enough
  # for evcc's estimated charge time. evcc's own planner would plan nothing before ~13:00 (it
  # counts on the unpriced night). Fixed until the next tap on Smart, which replans.
  # Optional soc + time set a new target first (evcc recomputes the charge time at once).
  evcc_smart_plan:
    alias: evcc Smart plan
    mode: queued
    fields:
      soc:
        description: Target battery %, 1-100
      time:
        description: Target time every day, HH:MM
    sequence:
      - if: "{{ soc is defined and time is defined and (soc | int(0)) in range(1, 101) and time is match('^([01][0-9]|2[0-3]):[0-5][0-9]$') }}"
        then:
          - action: rest_command.evcc_set_plan_target
            data:
              soc: "{{ soc | int }}"
              time: "{{ time }}"
      - action: rest_command.evcc_get
        data:
          path: loadpoints/1/plan
        response_variable: plan
      - action: rest_command.evcc_get
        data:
          path: tariff/grid
        response_variable: tariff
      - variables:
          base: "{{ (now().timestamp() // 900) | int }}"
          rates: "{{ tariff.content.rates or [] }}"
          # shortcut: one rate = one quarter (Zonneplan's quarterly prices); an hourly tariff needs splitting
          picked: >-
            {%- set target = as_timestamp(plan.content.planTime, 0) if plan.content.planId else 0 -%}
            {%- set n = ((plan.content.duration | float(0)) / 900) | round(0, 'ceil') | int -%}
            {%- set ns = namespace(q=[]) -%}
            {%- for r in rates | sort(attribute='value') -%}
              {%- set q = (as_timestamp(r.start) // 900) | int -%}
              {%- if ns.q | count < n and q >= base and as_timestamp(r.end) <= target %}{% set ns.q = ns.q + [q] %}{% endif -%}
            {%- endfor -%}
            {{ ns.q }}
          value: >-
            {%- set ns = namespace(hex='') -%}
            {%- for d in range(((picked | max - base) // 4 + 1) if picked else 0) -%}
              {%- set v = namespace(n=0) -%}
              {%- for b in range(4) if base + d * 4 + b in picked %}{% set v.n = v.n + 8 // 2 ** b %}{% endfor -%}
              {%- set ns.hex = ns.hex ~ '0123456789abcdef'[v.n] -%}
            {%- endfor -%}
            {{ base }}:{{ ns.hex }}:{{ ((as_timestamp((rates | last).end) // 900) | int) if rates else base }}
      - action: input_text.set_value
        target:
          entity_id: input_text.evcc_smart_hours
        data:
          value: "{{ value }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.evcc_charge_mode
        data:
          option: smart
      - action: homeassistant.update_entity # the card and the target-SoC stop read these
        target:
          entity_id: [sensor.evcc_charge_plan, sensor.evcc_vehicle_soc]

automation:
  - id: evcc_mode
    alias: evcc mode
    description: >-
      Drives evcc from input_select.evcc_charge_mode. Fast = evcc "now". Smart = "now" in
      the quarters script.evcc_smart_plan picked, until the target SoC, "off" otherwise:
      no solar logic, so no 3-min wind-down. Manual = "now" in the
      painted quarters, "off" otherwise. Solar = evcc "smart" with the repeating plans off,
      i.e. surplus only. Phases: 3, Solar 1, only ever sent while the car is unplugged
      (evcc applies them at the next plug-in, before power flows): the Kia e-Niro can
      short L1-L2 when a session moves from 1 to 3 phases.
    mode: queued
    max: 5
    triggers:
      - trigger: time_pattern # quarter boundaries, and Smart's target SoC
        minutes: /1
        seconds: 5
      - trigger: state
        entity_id:
          - input_select.evcc_charge_mode
          - input_text.evcc_manual_hours
          - input_text.evcc_smart_hours
          - sensor.evcc_mode # evcc's real mode drifted: put it back
      - trigger: state
        entity_id: sensor.evcc_vehicle_soc
        attribute: connected
        to: false
      - trigger: homeassistant
        event: start
    conditions:
      - "{{ states('input_select.evcc_charge_mode') in ['smart', 'fast', 'manual', 'solar'] }}"
    actions:
      - variables:
          mode: "{{ states('input_select.evcc_charge_mode') }}"
          t: "{{ now().timestamp() }}"
          # this quarter is in Smart's or Manual's quarters
          painted: >-
            {%- set s = states('input_text.evcc_smart_hours' if mode == 'smart' else 'input_text.evcc_manual_hours') -%}
            {%- set bits = s.split(':')[1] if s is match('^[0-9]+:[0-9a-f]*(:[0-9]+)?$') else '' -%}
            {%- set i = (t // 900) | int - (s.split(':')[0] | int(0)) -%}
            {{ 0 <= i < bits | length * 4 and ((bits[i // 4] | int(0, 16)) // 2 ** (3 - i % 4)) % 2 == 1 }}
          want: >-
            {% if mode == 'fast' %}now{% elif mode == 'smart' %}{{ 'now' if painted | bool and states('sensor.evcc_vehicle_soc') | float(100) < state_attr('sensor.evcc_vehicle_soc', 'effectivePlanSoc') | float(0) else 'off' }}{% elif mode == 'manual' %}{{ 'now' if painted | bool else 'off' }}{% else %}smart{% endif %}
          plans_active: "{{ mode != 'solar' }}"
          phases: "{{ 1 if mode == 'solar' else 3 }}"
      # Solar must not charge from the grid for the plan; the other modes keep it so Smart has a target
      - if: >-
          {{ (state_attr('sensor.evcc_mode', 'repeatingPlans') or []) | selectattr('active', 'ne', plans_active) | list | count > 0 }}
        then:
          - action: rest_command.evcc_set_plans_active
            data:
              active: "{{ plans_active }}"
      # compare with what evcc reports (sensor), not with what HA last asked
      - if: "{{ states('sensor.evcc_mode') != want }}"
        then:
          - action: rest_command.evcc_set_mode
            data:
              mode: "{{ want }}"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.evcc_mode
      # strictly false: an unavailable sensor (None) must never count as unplugged
      - if: "{{ state_attr('sensor.evcc_vehicle_soc', 'connected') is sameas false and state_attr('sensor.evcc_vehicle_soc', 'phasesConfigured') != phases }}"
        then:
          - action: rest_command.evcc_set_phases
            data:
              phases: "{{ phases }}"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.evcc_vehicle_soc

  - id: evcc_simulated_car_plug
    alias: evcc simulated car plug
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_boolean.evcc_simulated_car_plugged
        to: ["on", "off"]
    actions:
      - if: "{{ trigger.to_state.state == 'on' }}"
        then:
          - action: shell_command.evcc_plug_in_simulated_car
        else:
          - action: shell_command.evcc_unplug_simulated_car
